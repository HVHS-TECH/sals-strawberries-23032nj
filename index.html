<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nia's Nectarines</title>
  <link rel="icon" type="image/x-icon" href="assets/strawberry.jpg">
  <link rel="stylesheet" href="style.css" />

  <!-- firebase start ****************************************-->
  <!-- Firebase App (core Firebase SDK) is always required & must be listed 1st -->
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-app.js"></script>
  <!-- Add Firebase products that you want to use -->
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-analytics.js"></script>
  <!-- firebase end ******************************************-->

  <script src="fb_setup.js"></script>
  <script src="fb_io.js"></script>
  <!-- <script type="module" src="./main.mjs"></script> -->

</head>
<body>
  <div class="container">
    <h1>Nia's Nectarines</h1>
    <h2>(and other fruit products)</h2>

    <button onclick="fb_authenticate()">Login with Google</button> 
    <P> <div id="databaseOutput"></div> </P>


    <form id="fruitForm">
      <label for="name">Your Name:</label>
      <input type="text" id="name" name="name" required />

      <label for="favoriteFruit">Favorite Fruit:</label>
      <input type="text" id="favoriteFruit" name="favoriteFruit" required />

      <label for="fruitQuantity">How many servings per week?</label>
      <input type="number" id="fruitQuantity" name="fruitQuantity" min="1" max="30" required />

      <!-- add more fields here -->
    </form>

    <button onclick="fb_write()">Submit</button>

    <p id="p_name"> </p>
    <p id="p_favoriteFruit"> </p>
    <p id="p_servings"> </p>

    <button onclick="fb_email()">Email</button>

    <p id="statusMessage"></p>
  </div>

  <script src="script.js"></script>

</body>
</html>
